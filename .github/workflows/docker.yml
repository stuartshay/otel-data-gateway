name: Build and Push Docker Image

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to Docker Hub'
        required: true
        default: true
        type: boolean
      publish_types:
        description: 'Regenerate and force-publish @stuartshay/otel-graphql-types'
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [master, develop]

env:
  IMAGE_NAME: stuartshay/otel-data-gateway

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get build info
        id: build_info
        run: |
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          BRANCH_NAME="${GITHUB_REF_NAME}"
          SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[\/]/-/g' | sed 's/[^a-zA-Z0-9._-]//g' | tr '[:upper:]' '[:lower:]')
          echo "branch_sanitized=$SANITIZED_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Determine version tag
        id: version
        run: |
          BRANCH="${{ steps.build_info.outputs.branch_sanitized }}"

          if [[ ! -f VERSION ]]; then
            echo "ERROR: VERSION file not found"
            exit 1
          fi

          BASE_VERSION=$(cat VERSION)
          if ! echo "$BASE_VERSION" | grep -qE '^[0-9]+\.[0-9]+$'; then
            echo "ERROR: VERSION file must contain major.minor (e.g., 1.0)"
            exit 1
          fi

          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            VERSION="${BASE_VERSION}.${{ github.run_number }}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            VERSION="${BASE_VERSION}.${{ github.run_number }}-${BRANCH}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Version: ${VERSION}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=otel-data-gateway
            org.opencontainers.image.description=Apollo Server GraphQL BFF for otel-data-api
            org.opencontainers.image.vendor=stuartshay
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Determine push condition
        id: push
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "should_push=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.push_image }}" == "true" ]]; then
            echo "should_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.push.outputs.should_push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}

      - name: Update Docker Hub description
        if: github.ref == 'refs/heads/master'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: 'otel-data-gateway - Apollo Server GraphQL BFF for otel-data-api'
          readme-filepath: ./README.md

      - name: Trigger k8s-gitops update
        if: github.ref == 'refs/heads/master'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GITOPS_PAT }}
          repository: stuartshay/k8s-gitops
          event-type: otel-data-gateway-release
          client-payload: '{"version": "${{ steps.version.outputs.version }}"}'
        continue-on-error: true

      - name: Record New Relic deployment marker
        if: github.ref == 'refs/heads/master' && steps.push.outputs.should_push == 'true'
        env:
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_APP_GUID: ${{ secrets.NEW_RELIC_APP_GUID }}
        run: |
          if [[ -z "${NEW_RELIC_API_KEY}" || -z "${NEW_RELIC_APP_GUID}" ]]; then
            echo "⚠️ Skipping: NEW_RELIC_API_KEY or NEW_RELIC_APP_GUID not configured"
            exit 0
          fi

          VERSION="${{ steps.version.outputs.version }}"
          DESCRIPTION="${{ env.IMAGE_NAME }} v${VERSION}"

          # shellcheck disable=SC2016
          QUERY='mutation($version: String!, $entityGuid: EntityGuid!, $commit: String, $user: String, $description: String) {
            changeTrackingCreateDeployment(deployment: {
              version: $version
              entityGuid: $entityGuid
              commit: $commit
              user: $user
              description: $description
            }) { deploymentId entityGuid }
          }'

          PAYLOAD=$(jq -n \
            --arg query "$QUERY" \
            --arg version "$VERSION" \
            --arg entityGuid "$NEW_RELIC_APP_GUID" \
            --arg commit "${{ github.sha }}" \
            --arg user "${{ github.actor }}" \
            --arg description "$DESCRIPTION" \
            '{query: $query, variables: {version: $version, entityGuid: $entityGuid, commit: $commit, user: $user, description: $description}}')

          RESPONSE=$(curl -s -X POST 'https://api.newrelic.com/graphql' \
            -H 'Content-Type: application/json' \
            -H "API-Key: ${NEW_RELIC_API_KEY}" \
            -d "$PAYLOAD")

          if echo "${RESPONSE}" | jq -e '.data.changeTrackingCreateDeployment.deploymentId' > /dev/null 2>&1; then
            DEPLOY_ID=$(echo "${RESPONSE}" | jq -r '.data.changeTrackingCreateDeployment.deploymentId')
            echo "✅ Deployment marker recorded: ${DEPLOY_ID}"
          else
            echo "⚠️ Failed to record deployment marker"
            echo "${RESPONSE}"
          fi
        continue-on-error: true

      - name: Summary
        run: |
          {
            echo "## Docker Build Summary"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Version | \`${{ steps.version.outputs.version }}\` |"
            echo "| Branch | \`${{ steps.build_info.outputs.branch_sanitized }}\` |"
            echo "| Build # | \`${{ github.run_number }}\` |"
            echo "| Pushed | \`${{ steps.push.outputs.should_push }}\` |"
            echo ""
            echo "### Tags"
            echo "\`\`\`"
            echo "${{ steps.meta.outputs.tags }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Schema detection and npm publishing
  # Only runs on master pushes (after a successful Docker build). Publishes
  # @stuartshay/otel-graphql-types at the SAME version as the image whenever the
  # generated GraphQL types change, and dispatches the otel-data-ui update.
  # Mirrors the otel-data-api docker.yml pattern.
  schema-check:
    name: Check GraphQL Schema Changes
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_types))

    outputs:
      schema_changed: ${{ steps.detect.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Detect schema changes
        id: detect
        env:
          FORCE_PUBLISH_TYPES: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_types }}
        run: |
          # Regenerate the published type artifacts from the GraphQL schema.
          npm run build:types-package

          # Compare regenerated artifacts against the committed versions. This
          # catches cases where the schema changed but generated artifacts were
          # not committed, and where the committed artifacts changed in the push.
          SHOULD_PUBLISH=false

          if [ "$FORCE_PUBLISH_TYPES" = "true" ]; then
            echo "✓ Manual publish requested via workflow_dispatch"
            SHOULD_PUBLISH=true
          elif ! git diff --quiet -- packages/graphql-types/index.d.ts packages/graphql-types/schema.graphql 2>/dev/null; then
            echo "✓ Generated types differ from committed versions"
            SHOULD_PUBLISH=true
          elif git rev-parse HEAD^ >/dev/null 2>&1 && \
               ! git diff --quiet HEAD^ HEAD -- packages/graphql-types/index.d.ts packages/graphql-types/schema.graphql src/schema/schema.graphql 2>/dev/null; then
            echo "✓ Committed schema/type artifacts changed in this push"
            SHOULD_PUBLISH=true
          else
            echo "No changes affecting types detected"
          fi

          if [ "$SHOULD_PUBLISH" = true ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "GraphQL types changed — will publish"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated types
        if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: generated-graphql-types
          path: |
            packages/graphql-types/index.d.ts
            packages/graphql-types/schema.graphql
          retention-days: 7

  publish-types:
    name: Publish Types to npm
    runs-on: ubuntu-latest
    needs: schema-check
    if: needs.schema-check.outputs.schema_changed == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download generated types
        uses: actions/download-artifact@v8
        with:
          name: generated-graphql-types
          path: packages/graphql-types

      - name: Update package version
        run: |
          cd packages/graphql-types
          BASE_VERSION=$(cat ../../VERSION)
          PKG_VERSION="${BASE_VERSION}.${{ github.run_number }}"
          npm version "$PKG_VERSION" --no-git-tag-version --allow-same-version
          echo "Updated package.json to version: $PKG_VERSION"

      - name: Publish to npm
        run: |
          cd packages/graphql-types
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Get published version
        id: types_version
        run: |
          PKG_VERSION=$(jq -r '.version' packages/graphql-types/package.json)
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Trigger otel-data-ui types update
        id: ui_dispatch
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GITOPS_PAT }}
          repository: stuartshay/otel-data-ui
          event-type: otel-graphql-types-release
          client-payload: '{"version": "${{ steps.types_version.outputs.version }}"}'
        continue-on-error: true

      - name: Summary
        run: |
          if [ "${{ steps.ui_dispatch.outcome }}" = "success" ]; then
            DISPATCH_STATUS="✅"
          else
            DISPATCH_STATUS="❌ (${{ steps.ui_dispatch.outcome }})"
          fi
          {
            echo "## npm Package Published"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Package | \`@stuartshay/otel-graphql-types\` |"
            echo "| Version | \`${{ steps.types_version.outputs.version }}\` |"
            echo "| Run # | \`${{ github.run_number }}\` |"
            echo "| UI Dispatch | ${DISPATCH_STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"
